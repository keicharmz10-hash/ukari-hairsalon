<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap"
    rel="stylesheet">
  <!-- meta property desc,title,img,type,site -->
  <meta name="description" content="岡本・芦屋の自然派美容室 u★kuri。上質な癒し空間と丁寧なカウンセリング。">
  <meta property="og:title" content="u★kuri Hair Salon">
  <meta property="og:description" content="自然と調和する上質なヘアサロン">
  <meta property="og:image" content="img/ogimage.jpg">
  <meta property="og:type" content="website">

  <link rel="icon" href="img/favicon.png">
  <!-- CSS Link -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animation.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- AOS Link -->
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
</head>

<body>
  <header class="header">
    <div class="logo">
      <a href="index.html">
        <img src="img/logo/logo(1).png" alt="u★kuri logo">
      </a>
    </div>

    <nav class="nav">
      <a href="index.html" class="nav-link" data-ja="トップ" data-en="Top">Top</a>
      <a href="salons.html" class="nav-link" data-ja="サロン" data-en="Salons">Salons</a>
      <a href="menu.html" class="nav-link" data-ja="メニュー" data-en="Menu">Menu</a>
      <a href="hairstyle.html" class="nav-link" data-ja="ヘアスタイル" data-en="Hair Style">Hair Style</a>
      <a href="product.html" class="nav-link" data-ja="商品" data-en="Product">Product</a>
      <a href="news.html" class="nav-link" data-ja="ニュース" data-en="News">News</a>
      <a href="recruit.html" class="nav-link" data-ja="採用情報" data-en="Recruit">Recruit</a>
      <a href="contact.html" class="nav-link" data-ja="連絡先" data-en="Contact">Contact</a>
      <!-- language toggle -->
      <button id="langToggle" class="lang-btn">EN / JP</button>
    </nav>

    <a href="reservation.html" class="reserve" data-ja="ご予約" data-en="Reserve">Reserve
    </a>
    <!-- Hamburger -->
    <div class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <section class="section">

    <h2 data-ja="ご予約はこちら" data-en="Reservation">ご予約はこちら</h2>

    <form class="booking-form">

      <input type="text" placeholder="Name">

      <input type="email" placeholder="Email" data-ja="" data-en="">

      <select>
        <option data-ja="サービスを選択" data-en="Select Service">サービスを選択</option>
        <option data-ja="カット" data-en="Cut">カット</option>
        <option data-ja="カラー" data-en="Color">カラー</option>
        <option data-ja="パーマ" data-en="Perm">パーマ</option>
      </select>

      <label>店舗を選択</label>
      <select id="salon">
        <option value="" data-ja="店舗を選択してください" data-en="Please select the salon">店舗を選択してください</option>
        <option value="koshien" data-ja="甲子園店" data-en="Koshien">甲子園店</option>
        <option value="ashiya" data-ja="芦屋店" data-en="Ashiya">芦屋店</option>
        <option value="okamoto" data-ja="岡本店" data-en="Okamoto">岡本店</option>
      </select>

      <label>スタイリスト</label>
      <select id="stylist">
        <option value="">スタイリストを選択</option>
      </select>

      <textarea placeholder="Message"></textarea>

      <button class="btn" data-ja="予約送信" data-en="Send Reservation">予約送信</button>

    </form>

  </section>
  <div class="modal">
    <div class="modal-box">
      <span class="close">&times;</span>
      <div class="modal-content"></div>
    </div>
  </div>
  <footer class="footer">
    <p>© 2026 u★kuri Hair Salon</p>
  </footer>
  <script src="js/main.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
 
  <script>
    AOS.init({
      duration: 1200,
      easing: "ease-out-cubic",
      once: false
    });
  </script>
  <!-- stylist -->
  <script>
    const stylists = {
      koshien: ["田中ゆき・Yuki Tanaka", "佐藤 まい・Mai Sato", "加藤 りな・Rina Kato"],
      ashiya: ["伊藤 はるか・Haruka Ito", "山田 みか・Mika Yamada", "森 あやか・Ayaka Mori"],
      okamoto: ["鈴木 なおみ・Naomi Suzuki", "西田 えりか・Erika Nishida", "小林 さき・Saki Kobayashi"]
    };

    const salonSelect = document.getElementById("salon");
    const stylistSelect = document.getElementById("stylist");

    salonSelect.addEventListener("change", function () {

      const salon = this.value;

      stylistSelect.innerHTML = '<option value="">スタイリストを選択</option>';

      if (stylists[salon]) {

        stylists[salon].forEach(function (name) {

          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;

          stylistSelect.appendChild(option);

        });

      }

    });
  </script>
</body>

</html>
